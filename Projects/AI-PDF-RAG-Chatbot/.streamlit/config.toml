[theme]
primaryColor = "#00FFA3" # Premium Neon Green/Cyan
backgroundColor = "#0F172A" # Sleek Dark Slate background
secondaryBackgroundColor = "#1E293B" # Darker Slate for sidebar/widgets
textColor = "#F8FAFC" # Off-white text
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 50 # 50 MB limits
